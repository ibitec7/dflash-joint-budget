[project]
name = "dflash-joint-budget"
version = "0.1.0"
description = "Course project: critique of DFlash (arXiv 2602.06036) and a joint draft-width / verify-length budget controller for block-diffusion speculative decoding"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.56",
    "accelerate>=1.4",
    "datasets>=3.2",
    "huggingface-hub>=0.28",
    "safetensors>=0.5",
    "numpy>=2.0",
    "scipy>=1.15",
    "pandas>=2.2",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "tqdm>=4.67",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
